<ol class="publication-list">
{% for publication in site.data.publications %}
  <li>
    <strong>{{ publication.title | escape }}</strong><br />
    {{ publication.authors | escape | replace: 'Junteng Liu', '<strong>Junteng Liu</strong>' }}.<br />
    <em>{{ publication.venue | escape }}</em> · {{ publication.role | escape }}
  </li>
{% endfor %}
</ol>
