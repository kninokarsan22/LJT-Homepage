atom_feed:
  hide: true

# No example collection content is published.
collections:
  publications:
    output: false
  portfolio:
    output: false
  talks:
    output: false
  teaching:
    output: false

include:
  - _pages
exclude:
  - .bundle
  - .devcontainer
  - .github
  - .jekyll-cache
  - .sass-cache
  - _drafts
  - _posts
  - _publications
  - _portfolio
  - _talks
  - _teaching
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - files
  - images/500x300.png
  - images/bio-photo-2.jpg
  - images/bio-photo.jpg
  - images/editing-talk.png
  - images/profile.png
  - images/themes
  - images/wiki
  - markdown_generator
  - node_modules
  - scripts
  - talkmap
  - talkmap.ipynb
  - talkmap.py
  - talkmap_out.ipynb
  - vendor
  - AGENTS.md
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - LICENSE
  - package.json
  - README.md

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-sitemap
whitelist:
  - jekyll-sitemap
