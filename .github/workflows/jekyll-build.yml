name: Jekyll build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Check personal pages and publication lists
        run: |
          set -euxo pipefail
          find _site -maxdepth 3 -type f | sort | head -n 100
          grep -R -l "SynLogic: Synthesizing Verifiable Reasoning Data at Scale" _site || true
          test -f _site/index.html
          test -f _site/publications/index.html
          grep -q "SynLogic: Synthesizing Verifiable Reasoning Data at Scale" _site/index.html
          grep -q "SynLogic: Synthesizing Verifiable Reasoning Data at Scale" _site/publications/index.html
          ! test -e _site/talks/index.html
          ! test -e _site/teaching/index.html
          ! test -e _site/portfolio/index.html
